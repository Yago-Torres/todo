# El proyecto de Xcode no se guarda: lo genera XcodeGen en el Mac de GitHub Actions (.github/workflows/ios.yml).
# Así no hay un .pbxproj de miles de líneas que editar a mano desde la Pi.
name: Hoy
options:
  bundleIdPrefix: dev.yagotg
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
targets:
  Hoy:
    type: application
    platform: iOS
    sources:
      - Hoy
      - Compartido
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.yagotg.hoy
        INFOPLIST_FILE: Hoy/Info.plist
        CODE_SIGN_ENTITLEMENTS: Hoy/Hoy.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # un icono por tema (Assets.xcassets/Icono-<tema>.appiconset, IconoTema.swift): Xcode los pone en CFBundleAlternateIcons
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "Icono-hormigon Icono-shibuya Icono-kioto Icono-sakura Icono-calma Icono-terminal Icono-prensa Icono-fiordo Icono-cafe Icono-bauhaus Icono-miami Icono-matcha Icono-lavanda Icono-medianoche Icono-braun Icono-bosque Icono-arena Icono-grafito"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: HoyWidget
        embed: true
        codeSign: false
      - target: HoyCompartir
        embed: true
        codeSign: false
  HoyWidget:
    type: app-extension
    platform: iOS
    sources:
      - HoyWidget
      - Compartido
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.yagotg.hoy.widget
        INFOPLIST_FILE: HoyWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: HoyWidget/HoyWidget.entitlements
        SKIP_INSTALL: "YES"
  # «Leer luego» en la hoja de compartir. Solo lo de Compartido que necesita (sin App Intents ni ActivityKit).
  HoyCompartir:
    type: app-extension
    platform: iOS
    sources:
      - HoyCompartir
      - path: Compartido
        includes: ["Almacen.swift", "API.swift", "Modelos.swift", "Fecha.swift"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.yagotg.hoy.compartir
        INFOPLIST_FILE: HoyCompartir/Info.plist
        CODE_SIGN_ENTITLEMENTS: HoyCompartir/HoyCompartir.entitlements
        SKIP_INSTALL: "YES"
