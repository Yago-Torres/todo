<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>todo · mini</title>
<style>
  :root { --fondo: #F2F2F2; --carta: #FFFFFF; --texto: #161616; --suave: #6A6A6A; --linea: #DEDEDE; --acento: #2E8B57; --peligro: #C0392B; }
  @media (prefers-color-scheme: dark) { :root { --fondo: #111111; --carta: #1B1B1B; --texto: #EDEDED; --suave: #9A9A9A; --linea: #2F2F2F; --acento: #3FA56C; --peligro: #E57368; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; padding: 10px; background: var(--fondo); color: var(--texto); font: 14px/1.4 system-ui, sans-serif;
         display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; gap: 8px; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; background: var(--carta); border: 1px solid var(--linea); border-radius: 10px; padding: 3px; }
  .seg button { font: inherit; font-size: 13px; border: 0; border-radius: 8px; padding: 5px; background: none; color: var(--suave); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--acento); color: #fff; font-weight: 600; }
  textarea { font: inherit; color: var(--texto); background: var(--carta); border: 1px solid var(--linea); border-radius: 10px; padding: 8px 10px; resize: none; height: 64px; }
  textarea:focus { outline: none; border-color: var(--acento); }
  ul { list-style: none; margin: 0; padding: 0; overflow-y: auto; }
  li { padding: 6px 2px; border-top: 1px solid var(--linea); overflow-wrap: anywhere; }
  li:first-child { border-top: 0; }
  li small { display: block; color: var(--suave); font-size: 11px; }
  li.pend { opacity: .6; }
  #pie { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--suave); }
  #pie button { font: inherit; font-size: 12px; border: 1px solid var(--linea); background: var(--carta); color: var(--texto); border-radius: 999px; padding: 3px 10px; cursor: pointer; }
  #msg.mal { color: var(--peligro); }
  #msg.bien { color: var(--acento); }
</style>
<body>
<div class="seg" role="group" aria-label="Qué apuntas">
  <button type="button" data-t="nota" aria-pressed="true">Nota</button>
  <button type="button" data-t="tarea" aria-pressed="false">Tarea</button>
</div>
<textarea id="t" maxlength="1000" aria-label="Texto" placeholder="Intro guarda · Ctrl+1 nota · Ctrl+2 tarea"></textarea>
<ul id="lista" aria-label="Lo último apuntado"></ul>
<div id="pie"><span id="msg" role="status"></span><button type="button" id="ver">Ver todo</button></div>
<script>
// Ventanita siempre encima: no se cierra al guardar. Debajo, las últimas notas (o las tareas de Pendientes).
const $ = s => document.querySelector(s), t = $("#t"), msg = $("#msg");
let tipo = "nota", ocupado = false;
const di = (x, c = "") => { msg.textContent = x; msg.className = c; if (c === "bien") setTimeout(() => di(""), 1800); };
const MESES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
const corta = s => { if (!s) return ""; const [d, h] = s.split(" "), [, m, dia] = d.split("-").map(Number); return `${dia} ${MESES[m - 1]}${h ? ", " + h : ""}`; };

async function api(url, cuerpo) {
  const r = await fetch(url, cuerpo === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(cuerpo)});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail || `El servidor contesta ${r.status}`);
  return j;
}

async function lista() {
  try {
    const li = (txt, sub) => { const e = document.createElement("li"); e.textContent = txt; if (sub) { const s = document.createElement("small"); s.textContent = sub; e.append(s); } return e; };
    if (tipo === "nota") {
      const {notas} = await api("/api/notas");
      $("#lista").replaceChildren(...notas.slice(0, 12).map(n => li(n.t, corta(n.cuando))));
    } else {
      const {tareas} = await api("/api/bandeja?solo=tareas");
      $("#lista").replaceChildren(...tareas.slice(0, 12).map(x => li(x.t, [x.due, x.hora].filter(Boolean).join(" ") || x.nota)));
    }
  } catch (e) { di(e.message, "mal"); }
}

function pon(x) {
  tipo = x;
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.t === x));
  t.focus();
  lista();
}

async function guarda() {
  const x = t.value.trim();
  if (!x || ocupado) return;
  ocupado = true;
  try {
    await api(tipo === "nota" ? "/api/nota" : "/api/tarea", {t: tipo === "nota" ? x : x.replace(/\s+/g, " ")});
    t.value = "";
    di(tipo === "nota" ? "Nota apuntada" : "A Pendientes", "bien");
    lista();
  } catch (e) { di(e.message, "mal"); }
  ocupado = false;
}

document.querySelectorAll(".seg button").forEach(b => b.onclick = () => pon(b.dataset.t));
$("#ver").onclick = () => fetch("/_escritorio/abrir", {method: "POST", headers: {"Content-Type": "application/json"},
  body: JSON.stringify({ruta: tipo === "nota" ? "/notas.html" : "/pendientes.html"})});
t.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); guarda(); } });
addEventListener("keydown", e => { if (e.ctrlKey && (e.key === "1" || e.key === "2")) { e.preventDefault(); pon(e.key === "1" ? "nota" : "tarea"); } });
addEventListener("focus", () => { t.focus(); lista(); });
setInterval(() => document.visibilityState === "visible" && lista(), 120000);
pon("nota");
</script>
</body>
</html>
