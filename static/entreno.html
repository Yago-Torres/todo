<!doctype html>
<html lang="es" data-vt>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="calma-datos" content="/api/state">
<meta name="calma-entrada" content="espera">
<meta name="theme-color" content="#F4F5F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171A16" media="(prefers-color-scheme: dark)">
<title>Entreno</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.json" crossorigin="use-credentials">

<meta name="apple-mobile-web-app-title" content="Todo">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="/calma.css?v=c6f4bacb">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="/calma.js?v=c6f4bacb"></script>

<style>
  /* de una página a otra, la cabecera vuela y la barra de abajo se queda quieta (calma.css, calma.js) */
  @view-transition { navigation: auto; }
  @media (prefers-reduced-motion: reduce) { @view-transition { navigation: none; } }
  /* Estilo Calma: tokens y componentes en /calma.css (fuente: ~/estilo). Aquí solo lo de entreno. */
  body { padding: 16px; padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px)); }
  .app { max-width: 1120px; margin: 0 auto; display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
  .col { display: grid; gap: 14px; align-content: start; min-width: 0; }
  @media (min-width: 920px) { .app { grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); } }
  .top { grid-column: 1 / -1; display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; padding: 4px 2px 0; }
  h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
  .top nav { margin-left: auto; display: flex; gap: 6px; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
  .top nav a { text-decoration: none; }
  #estado { font-size: 13px; color: var(--suave); }
  .carta { padding: 16px; min-width: 0; }
  .carta h2 { margin: 0 0 12px; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .carta h2 .der { margin-left: auto; font-weight: 400; }
  .carta h2 a { margin-left: auto; font-size: 13px; font-weight: 500; color: var(--acento); text-decoration: none; }
  .vacio { margin: 0; padding: 8px 2px; font-size: 14px; color: var(--suave); }
  .eti-sup { font-size: 13px; color: var(--suave); }
  .cifra { font-size: 40px; font-weight: 700; letter-spacing: -.03em; line-height: 1.1; margin: 2px 0; font-variant-numeric: tabular-nums; }
  .cifra small { font-size: 16px; font-weight: 500; color: var(--suave); letter-spacing: 0; margin-left: 4px; }
  .bajo { margin: 0 0 10px; font-size: 14px; color: var(--suave); }
  select.c-campo { width: 100%; }

  /* ---------- fichas de hoy ---------- */
  .ficha { background: var(--carta-2); border-radius: 12px; padding: 12px; margin-bottom: 8px; }
  .ficha.hecha { background: var(--acento-suave); }
  .ficha .cab { display: flex; align-items: center; gap: 7px; }
  .ficha .cab i { width: 8px; height: 8px; flex: 0 0 8px; border-radius: 50%; background: var(--c); }
  .ficha .cab b { font-size: 13px; font-weight: 500; color: var(--suave); }
  .ficha .cab .c-chip { margin-left: auto; }
  .ficha .tit { font-size: 17px; font-weight: 600; letter-spacing: -.01em; margin-top: 4px; }
  .ficha .sub { font-size: 13px; color: var(--suave); margin-top: 2px; }
  .ficha .acc { display: flex; gap: 8px; margin-top: 10px; }
  .ficha .acc > * { flex: 1; min-width: 0; min-height: 42px; }
  .ficha details { margin-top: 8px; font-size: 14px; }
  .ficha details summary { cursor: pointer; color: var(--suave); font-size: 13px; }
  .ficha details li { margin: 6px 0; }
  .ficha details small { display: block; color: var(--suave); }
  .otra { margin-top: 4px; }

  /* ---------- músculos ---------- */
  .cuerpos { display: flex; justify-content: center; gap: 12px; }
  .cuerpos figure { margin: 0; flex: 0 1 170px; text-align: center; }
  .cuerpos figcaption { font-size: 12px; color: var(--tenue); }
  .cuerpos svg { width: 100%; height: auto; display: block; }
  /* el cuerpo en gris suave; cada músculo, del gris al color de acento según las series */
  .cuerpos polygon { fill: color-mix(in oklab, var(--texto) 16%, var(--carta)); stroke: var(--carta); stroke-width: .5; stroke-linejoin: round; }
  .cuerpos [data-m] { cursor: pointer; transition: fill .3s; }
  .cuerpos [data-n="1"], .ley i[data-n="1"] { fill: color-mix(in oklab, var(--acento) 35%, var(--carta-2)); background: color-mix(in oklab, var(--acento) 35%, var(--carta-2)); }
  .cuerpos [data-n="2"], .ley i[data-n="2"] { fill: color-mix(in oklab, var(--acento) 65%, var(--carta-2)); background: color-mix(in oklab, var(--acento) 65%, var(--carta-2)); }
  .cuerpos [data-n="3"], .ley i[data-n="3"] { fill: var(--acento); background: var(--acento); }
  .cuerpos [data-m].sel { stroke: var(--texto); stroke-width: .8; }
  .pista { margin: 6px 0 0; text-align: center; font-size: 12px; color: var(--tenue); }
  .pista b { color: var(--texto); font-weight: 600; }
  .ley { display: flex; justify-content: center; align-items: center; gap: 4px; margin: 10px 0 4px; font-size: 11px; color: var(--tenue); }
  .ley i { width: 12px; height: 10px; border-radius: 3px; background: color-mix(in oklab, var(--texto) 16%, var(--carta)); }
  .ley span { margin: 0 6px 0 2px; }
  .barras li { cursor: pointer; }
  .atras { margin-top: 12px; }
  .atras h3 { margin: 0 0 6px; font-size: 12px; font-weight: 600; color: var(--suave); letter-spacing: .04em; text-transform: uppercase; }
  .atras p { display: flex; align-items: center; gap: 10px; margin: 0 0 6px; font-size: 14px; }
  .atras p span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .atras p small { color: var(--suave); }
  .barras { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; }
  .barras li { display: grid; grid-template-columns: 8.5em minmax(0, 1fr) 3.4em; gap: 10px; align-items: center; font-size: 13px; border-radius: 6px; }
  .barras li.sel { background: var(--carta-2); }
  .barras .c-barra { height: 6px; }
  .barras b { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }

  /* ---------- progreso ---------- */
  .lienzo { position: relative; height: 220px; margin-top: 8px; }
  .prs { list-style: none; margin: 12px 0 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .prs li { background: var(--carta-2); border-radius: var(--r-s); padding: 10px; min-width: 0; }
  .prs small { display: block; font-size: 12px; color: var(--suave); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prs b { display: block; font-size: 16px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  details.datos { margin-top: 8px; font-size: 13px; color: var(--suave); }
  details.datos summary { cursor: pointer; width: max-content; }
  details.datos table { width: 100%; border-collapse: collapse; margin-top: 6px; font-variant-numeric: tabular-nums; }
  details.datos th, details.datos td { text-align: right; padding: 4px 6px; border-bottom: 1px solid var(--linea); font-weight: 400; white-space: nowrap; }
  details.datos th:first-child, details.datos td:first-child { text-align: left; }

  /* ---------- historial ---------- */
  .hist details { border-bottom: 1px solid var(--linea); padding: 10px 2px; }
  .hist details:last-child { border-bottom: 0; }
  .hist summary { cursor: pointer; display: grid; grid-template-columns: 3.6em minmax(0, 1fr); column-gap: 10px; align-items: baseline; list-style: none; }
  .hist summary::-webkit-details-marker { display: none; }
  .hist summary .d { font-size: 13px; font-weight: 600; color: var(--suave); grid-row: span 2; }
  .hist summary .n { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hist summary .x { font-size: 13px; color: var(--suave); font-variant-numeric: tabular-nums; }
  .hist ul { list-style: none; margin: 8px 0 0; padding: 0 0 0 4.3em; font-size: 14px; }
  .hist li { margin: 4px 0; }
  .hist li small { color: var(--suave); font-variant-numeric: tabular-nums; }
  .hist .borra { margin: 8px 0 0 4.3em; }

  /* ---------- carrera ---------- */
  .ses { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .ses li { display: grid; grid-template-columns: 4.2em minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px; border-radius: var(--r-s); background: var(--carta-2); }
  .ses .d { font-size: 13px; font-weight: 600; color: var(--suave); }
  .ses .n { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ses li.hecho .n { color: var(--suave); text-decoration: line-through; text-decoration-color: var(--tenue); }
  .ses li.hoy { box-shadow: inset 0 0 0 2px var(--acento); }
  .auto { display: flex; align-items: baseline; gap: 10px; margin: 10px 0 0; padding-left: 10px; border-left: 3px solid var(--acento); font-size: 14px; }
  .auto span { color: var(--suave); }

  /* ---------- peso ---------- */
  .peso { display: flex; align-items: baseline; gap: 6px 12px; flex-wrap: wrap; }
  .peso em { font-size: 26px; font-weight: 650; font-style: normal; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .peso span { font-size: 13px; color: var(--suave); }
  .chispa { display: flex; align-items: flex-end; gap: 3px; height: 34px; margin-top: 10px; }
  .chispa i { flex: 1 1 0; background: var(--acento); opacity: .55; border-radius: 3px 3px 0 0; min-height: 2px; }
  .chispa i:last-child { opacity: 1; }
  .fila-form { display: flex; gap: 8px; margin-top: 12px; }
  .fila-form .c-campo { flex: 1; min-width: 0; }

  /* ---------- hojas a pantalla completa ---------- */
  /* por encima del menú de abajo (150): entrenando no se navega */
  .hoja { position: fixed; inset: 0; z-index: 160; background: var(--fondo); display: none; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); }
  .hoja[data-on] { display: grid; }
  .hoja > header { background: var(--carta); border-bottom: 1px solid var(--linea); padding: 14px 16px; padding-top: calc(14px + env(safe-area-inset-top, 0px)); display: flex; align-items: center; gap: 10px; }
  .hoja > header b { flex: 1; min-width: 0; font-size: 18px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hoja > header .reloj { font-size: 15px; font-weight: 600; color: var(--suave); font-variant-numeric: tabular-nums; }
  .hoja > header button { border: 1px solid var(--linea); background: var(--carta); border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 500; color: var(--texto); }
  .hoja > .mid { overflow: auto; padding: 8px 16px 24px; min-height: 0; }
  .hoja > footer { display: grid; gap: 10px; padding: 12px 16px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--carta); border-top: 1px solid var(--linea); }
  .hoja > footer .botones { display: flex; gap: 10px; }
  .hoja > footer .botones button { flex: 1; min-height: 52px; border: 1px solid var(--linea); border-radius: 12px; background: var(--carta-2); font-size: 16px; font-weight: 600; color: var(--texto); }
  .hoja > footer button.si { background: var(--acento); border-color: var(--acento); color: var(--acento-texto); }

  /* modo entreno: un ejercicio, sus series en filas, y el descanso abajo */
  .ej { padding: 14px 0; border-bottom: 1px solid var(--linea); }
  .ej:last-child { border-bottom: 0; }
  /* el monigote del ejercicio: del color del texto, sin fondo, moviéndose entre el inicio y el final */
  .mono { display: block; flex: 0 0 90px; width: 90px; height: auto; color: var(--texto); }
  .fila-ej { display: flex; gap: 12px; align-items: flex-start; }
  .fila-ej .txt { flex: 1; min-width: 0; }
  #hg-foto:empty { display: none; }
  #hg-foto .mono { width: min(280px, 72vw); margin: 0 auto; }
  .ej .cab { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .ej .cab b { font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
  .ej .cab span { font-size: 13px; color: var(--suave); }
  .ej .cab .c-chip { margin-left: auto; }
  .ej .cab .quita { margin-left: auto; }
  .ej .cab .c-chip + .quita { margin-left: 0; }
  /* al final de la sesión: lo quitado hoy, para recuperarlo, y añadir otro ejercicio */
  .ej.pie .c-chip { margin: 0 6px 6px 0; }
  .anade { display: flex; gap: 8px; margin-top: 4px; }
  .anade input { flex: 1; min-width: 0; min-height: 44px; border: 1px solid var(--linea); border-radius: var(--r-s); background: var(--carta); padding: 0 10px; font-size: 16px; color: var(--texto); }
  .anade input:focus { outline: none; border-color: var(--acento); }
  .ej .nota { font-size: 13px; color: var(--suave); line-height: 1.45; margin: 4px 0 8px; }
  .ej .antes { font-size: 12px; color: var(--tenue); margin: 6px 0 0; font-variant-numeric: tabular-nums; }
  .serie { display: grid; grid-template-columns: 1.6em minmax(0, 1fr) auto minmax(0, 1fr) auto 48px; gap: 8px; align-items: center; margin-top: 6px; }
  .serie .i { font-size: 13px; font-weight: 600; color: var(--tenue); text-align: center; }
  .serie span { font-size: 13px; color: var(--suave); }
  /* 16px exactos: por debajo iOS hace zoom al enfocar */
  .serie input { width: 100%; min-height: 44px; border: 1px solid var(--linea); border-radius: var(--r-s); background: var(--carta); padding: 0 10px; font-size: 16px; text-align: right; font-variant-numeric: tabular-nums; color: var(--texto); }
  .serie input::placeholder { color: var(--tenue); }
  .serie input:focus { outline: none; border-color: var(--acento); }
  .serie .ok { width: 48px; height: 44px; border-radius: var(--r-s); border: 1px solid var(--linea); background: var(--carta); display: grid; place-items: center; color: var(--tenue); }
  .serie .ok svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .serie .ok:disabled { opacity: .35; }
  .serie.hecha input { background: var(--acento-suave); border-color: transparent; }
  .serie.hecha .ok { background: var(--acento); border-color: var(--acento); color: var(--acento-texto); }
  .ej .mas { margin-top: 8px; }
  /* el descanso, a pantalla completa: el número gigante se va derritiendo (filtro #derrite) y en los últimos 10 s
     el fondo late cada vez más rápido (--late, de 0 a 1). Con «reducir movimiento», quieto */
  .descanso { display: none; }
  .descanso[data-on] { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    padding: 24px 16px calc(24px + env(safe-area-inset-bottom, 0px)); background: color-mix(in srgb, var(--acento-suave) calc(var(--late, 0) * 100%), var(--fondo)); }
  .descanso b { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: clamp(96px, 30vw, 240px); font-weight: 700; letter-spacing: -.05em;
    line-height: 1; color: var(--acento); font-variant-numeric: tabular-nums; }
  .descanso[data-derrite] b { filter: url(#derrite); }
  .descanso small { font-size: 15px; color: var(--suave); }
  .descanso .ds-sig { margin: 0; font-size: 15px; color: var(--suave); text-align: center; max-width: 30ch; }
  .descanso .c-barra { width: min(420px, 84%); flex: none; margin: 0; }
  .descanso .ds-botones { display: flex; gap: 10px; }
  .descanso .ds-botones .c-btn { min-height: 48px; min-width: 76px; font-size: 16px; }
  /* «serie hecha» manteniendo 0,8 s: el anillo se llena por el borde; soltar antes, no cuenta */
  .serie .ok { position: relative; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .serie .ok svg.anillo { position: absolute; inset: -1px; width: calc(100% + 2px); height: calc(100% + 2px); pointer-events: none; overflow: visible; }
  .serie .ok .anillo rect { fill: none; stroke: var(--acento); stroke-width: 3; stroke-dasharray: 100; stroke-dashoffset: 100; transition: stroke-dashoffset .2s ease-out; }
  .serie .ok.lleno { background: var(--acento-suave); color: var(--acento); }
  .serie .ok.lleno .anillo rect { stroke-dashoffset: 0; transition: stroke-dashoffset .8s linear; }

  /* ---------- rutina guiada ---------- */
  .guia > .mid { display: flex; flex-direction: column; justify-content: center; text-align: center; gap: 14px; }
  .guia .paso { margin: 0; font-size: 14px; color: var(--suave); }
  .guia .ahora { margin: 0; font-size: clamp(1.8rem, 7.5vw, 3rem); font-weight: 700; line-height: 1.05; letter-spacing: -.02em; }
  .guia .resto { margin: 0; font-size: clamp(3.5rem, 18vw, 6rem); font-weight: 700; line-height: 1; color: var(--acento); font-variant-numeric: tabular-nums; }
  .guia .barra { height: 8px; border-radius: 99px; background: var(--carta-2); overflow: hidden; }
  .guia .barra i { display: block; height: 100%; background: var(--acento); border-radius: inherit; }
  .guia .como { margin: 0 auto; font-size: 16px; line-height: 1.5; max-width: 34ch; color: var(--suave); }
  .guia .luego { margin: 0; font-size: 14px; color: var(--tenue); }

  .puerta input { width: 100%; }
  .puerta button { width: 100%; }
  /* escalada (la tarjeta de abajo a la derecha): todo con esc- para no chocar con lo del gimnasio */
  .esc-caja { display: grid; gap: 8px; padding: 12px; background: var(--carta-2); border-radius: var(--r-s); margin-bottom: 12px; }
  .esc-caja .c-campo { background: var(--carta); min-width: 0; }
  .esc-pista { margin: 0; font-size: 13px; color: var(--suave); line-height: 1.45; }
  .esc-campo { display: grid; grid-template-columns: 4.2em minmax(0, 1fr); align-items: center; gap: 8px; font-size: 13px; color: var(--suave); }
  .esc-comp { display: flex; gap: 8px; align-items: center; justify-content: space-between; font-size: 13px; padding-top: 6px; border-top: 1px solid var(--linea); }
  .esc-comp small { color: var(--suave); }
  .esc-bloque { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 14px 0 4px; }
  .esc-bloque .c-chip, .esc-t .c-chip { font-size: 12px; padding: 1px 8px; font-weight: 500; }
  .esc-punto { width: 12px; height: 12px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1px var(--linea); }
  .esc-item { border-bottom: 1px solid var(--linea); }
  .esc-t { width: 100%; display: flex; gap: 8px; align-items: center; justify-content: space-between; padding: 10px 2px; background: none;
           border: 0; font: inherit; font-size: 14px; color: inherit; text-align: left; cursor: pointer; }
  .esc-det { display: grid; gap: 10px; padding-bottom: 12px; }
  .esc-det video { width: 100%; max-height: 72vh; background: #000; border-radius: var(--r-s); display: block; }
  .esc-vid { display: flex; gap: 6px; flex-wrap: wrap; }
  .esc-vid .c-btn[aria-pressed="true"] { background: var(--acento); color: var(--acento-texto); }
  .esc-coach { display: grid; gap: 6px; font-size: 14px; line-height: 1.5; }
  .esc-coach p { margin: 0; }
  .esc-coach ul { margin: 0; padding-left: 20px; }
  .esc-coach h3 { margin: 4px 0 0; font-size: 13px; font-weight: 600; color: var(--suave); }
  .esc-fila { display: grid; grid-template-columns: minmax(0, 1fr) 6.5em auto; gap: 8px; }
  /* subir un intento y los que van de camino (subiendo, analizando) con la vista previa del iPhone */
  .esc-subir { margin-bottom: 12px; }
  .esc-subir > .c-btn { width: 100%; }
  .esc-subir input[type=file] { font: inherit; font-size: 13px; color: var(--suave); min-width: 0; }
  .esc-dos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .esc-curso { border-bottom: 1px solid var(--linea); padding: 10px 2px; display: grid; gap: 8px; }
  .esc-curso .esc-t { padding: 0; cursor: default; }
  .esc-curso .c-barra { margin: 0; }
  .esc-previa { display: grid; gap: 6px; justify-items: center; }
  .esc-previa canvas { max-width: 100%; max-height: 60vh; border-radius: var(--r-s); background: var(--carta-2); display: block; }
  .esc-previa small { font-size: 12px; color: var(--suave); text-align: center; }
</style>

<script>
const $ = s => document.querySelector(s);
const el = (t, cls, txt) => { const e = document.createElement(t); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const MESES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
const DIAS = ["dom", "lun", "mar", "mié", "jue", "vie", "sáb"];
const fecha = s => new Date(s + "T12:00:00");
const corta = s => `${fecha(s).getDate()} ${MESES[fecha(s).getMonth()]}`;
const mas = (s, n) => { const d = fecha(s); d.setDate(d.getDate() + n); return d.toLocaleDateString("sv"); };
const HOY = new Date().toLocaleDateString("sv");
const uid = () => Math.random().toString(36).slice(2, 10);
const num = n => String(+n.toFixed(2)).replace(".", ",");   // 72,5 como se escribe aquí
const mmss = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12.5l4 4 8-9"/></svg>';

let S = null;
const hechos = d => S.log[d] || [];
const hecho = (d, h) => hechos(d).includes(h);
const rutina = id => S.rutinas.find(r => r.id === id);
const habito = id => S.habits.find(h => h.id === id);

function marca(h, on = !hecho(HOY, h)) {
  S.log[HOY] = on ? [...new Set([...hechos(HOY), h])] : hechos(HOY).filter(x => x !== h);
  if (!S.log[HOY].length) delete S.log[HOY];
}

// ---------- cargar y guardar (el estado entero, como Hábitos) ----------
function puerta(mostrar, msg) {
  $("#puerta").toggleAttribute("data-on", mostrar);
  $("#puerta-msg").textContent = msg || "Contraseña de todo";
  $("#puerta-msg").classList.toggle("mal", !!msg);
  if (mostrar) $("#puerta input").focus();
}

const normaliza = s => ({habits: [], log: {}, plan: {}, rutinas: [], sesion: {}, peso: {}, actividad: {}, gym: {}, ...s});

async function cargar() {
  try {
    const r = await fetch("/api/state");
    if (r.status === 401) { $("#estado").textContent = ""; return puerta(true); }
    if (!r.ok) throw new Error(r.status);
    S = normaliza(await r.json());
    version = r.headers.get("X-Version") || "";
    puerta(false);
    $("#estado").textContent = "";
    await estadoAvisos();
    pinta();
    anima.entrada();
    reanuda();
  } catch (e) {
    $("#estado").textContent = "Sin conexión";
  }
}

let pend, sinGuardar = false, version = "";
function guardar(repinta = true) {
  sinGuardar = true;
  if (repinta) pinta();
  $("#estado").textContent = "Guardando…";
  clearTimeout(pend);
  pend = setTimeout(async () => {
    sinGuardar = false;   // ya sale hacia el servidor
    try {
      const r = await fetch("/api/state", {method: "PUT", headers: {"Content-Type": "application/json", "X-Version": version}, body: JSON.stringify(S)});
      if (r.status === 401) { $("#estado").textContent = "Sesión caducada"; return puerta(true); }
      if (r.status === 409) { await refresca(true); $("#estado").textContent = "Había cambios de otro sitio: repite lo último"; tom.avisa("error"); return; }
      if (!r.ok) throw new Error(r.status);
      version = r.headers.get("X-Version") || "";
      $("#estado").textContent = "Guardado";
      fantasma.refresca();
    } catch (e) {
      $("#estado").textContent = "Sin guardar";
      tom.avisa("error");
    }
  }, 500);
}

// al volver a la app (o tras un 409) se trae lo último: una pestaña abierta desde ayer no guarda su copia vieja.
// Con una sesión o la rutina abiertas no: sus objetos apuntan al estado de ahora (salvo el 409, que manda)
async function refresca(siempre) {
  if (!siempre && (A || g)) return;
  const r = await fetch("/api/state").catch(() => null);
  if (!r || !r.ok || r.headers.get("X-Version") === version) return;
  S = normaliza(await r.json());
  version = r.headers.get("X-Version") || "";
  if (A) { const s = (S.gym[HOY] || []).find(x => x.id === A.s.id); s ? (A.s = s, pintaSesion()) : cierraSesion(); }
  if (g) g.r = rutina(g.r.id) || g.r;
  pinta();
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && !sinGuardar) refresca(); });

// ---------- series, récords y sugerencias ----------
// todas las sesiones con series, viejas primero: [{dia, s}]
const sesiones = () => Object.keys(S.gym).sort().flatMap(d => S.gym[d].map(s => ({dia: d, s})))
  .filter(x => x.s.ej.some(e => e.series.length));
const e1rm = (kg, r) => kg * (1 + r / 30);   // Epley: la fuerza de cada serie en una sola cifra
const mejor = series => series.reduce((a, x) => (e1rm(...x) > e1rm(...a) ? x : a));
// la serie que se va a apuntar supera a todas las de antes de ese ejercicio (fuerza estimada; sin peso, repes).
// La primera vez que se hace no: entonces todo sería récord
function esRecord(ej, [kg, r]) {
  const de = sesiones().flatMap(x => x.s.ej.filter(e => e.ej === ej).map(e => ({s: x.s, series: e.series})));
  if (!de.some(x => x.s !== A?.s)) return false;
  const antes = de.flatMap(x => x.series);
  return kg > 0 ? antes.every(([k, n]) => e1rm(kg, r) > e1rm(k, n)) : antes.every(([, n]) => r > n);
}

// la última vez que se hizo este ejercicio, sin contar la sesión de ahora
function ultima(ej, menos) {
  const l = sesiones().filter(x => x.s !== menos);
  for (let i = l.length - 1; i >= 0; i--) {
    const e = l[i].s.ej.find(e => e.ej === ej && e.series.length);
    if (e) return e.series;
  }
  return null;
}

const rango = txt => { const m = String(txt).match(/(\d+)\s*[-–]\s*(\d+)/) || String(txt).match(/^\s*(\d+)\s*$/); return m ? [+m[1], +(m[2] || m[1])] : null; };

// doble progresión: si la última vez todas las series llegaron al tope del rango con el mismo peso, toca subir
function sugerencia(b, menos) {
  const u = ultima(b.ej, menos), r = rango(b.repes);
  if (!u) return {kg: b.kg, sube: false, u};
  const top = Math.max(...u.map(x => x[0]));
  const sube = !!r && top > 0 && u.length >= b.series && u.every(x => x[0] >= top && x[1] >= r[1]);
  return {kg: sube ? top + (top < 20 ? 1 : 2.5) : top, sube, u};
}

const REGLAS = [

  [/curl femoral|femoral/, {femoral: 1}],

  [/core|plancha|abdominal|crunch|rueda/, {core: 1}],
];
const plano = t => t.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const musculos = ej => (REGLAS.find(([re]) => re.test(plano(ej))) || [0, {}])[1];

function porMusculo() {
  const n = Object.fromEntries(MUSCULOS.map(([m]) => [m, 0]));
  const desde = mas(HOY, -6);
  for (const {dia, s} of sesiones()) {
    if (dia < desde) continue;
    for (const e of s.ej) for (const [m, f] of Object.entries(musculos(e.ej))) n[m] += f * e.series.length;
  }
  return n;
}

const nivel = n => (n <= 0 ? 0 : n < 4 ? 1 : n < 10 ? 2 : 3);
let musSel = null;

function pintaMusculos() {
  const n = porMusculo(), nombre = Object.fromEntries(MUSCULOS);
  const caja = $("#cuerpos");
  if (!caja.children.length) {
    caja.innerHTML = Object.entries(CUERPO).map(([vista, piezas]) =>
      `<figure><svg viewBox="0 0 100 200" role="img" aria-label="Músculos, ${vista}">${
        piezas.map(([m, p]) => `<polygon points="${p}"${m ? ` data-m="${m}"` : ""}/>`).join("")
      }</svg><figcaption>${vista}</figcaption></figure>`).join("");
    caja.onclick = e => { const m = e.target.closest("[data-m]")?.dataset.m || null; musSel = m === musSel ? null : m; pintaMusculos(); };
  }
  for (const p of caja.querySelectorAll("[data-m]")) {
    const m = p.dataset.m;
    p.dataset.n = nivel(n[m]);
    p.classList.toggle("sel", m === musSel);
  }
  $("#pista").replaceChildren(...(musSel ? [el("b", null, nombre[musSel]), ` · ${num(n[musSel])} series en 7 días`]
                                         : ["Toca un músculo para ver sus series"]));
  // la misma información en barras: se lee sin colores y sin tocar el dibujo
  const max = Math.max(10, ...Object.values(n));
  $("#barras").replaceChildren(...MUSCULOS.slice().sort((a, b) => n[b[0]] - n[a[0]]).map(([m, t]) => {
    const li = el("li", m === musSel ? "sel" : ""), b = el("div", "c-barra");
    b.append(el("i"));
    b.style.setProperty("--p", (n[m] / max * 100) + "%");
    li.append(el("span", null, t), b, el("b", null, num(n[m])));
    li.onclick = () => { musSel = m === musSel ? null : m; pintaMusculos(); };
    return li;
  }));
}

// ---------- hoy ----------
function ficha(h, r) {
  const f = el("div", "ficha" + (hecho(HOY, h.id) ? " hecha" : ""));
  f.style.setProperty("--c", h.c);
  const cab = el("div", "cab");
  cab.append(el("i"), el("b", null, h.n));
  f.append(cab);
  if (!r) {
    // planificado sin rutina: que elija una de las que marcan este hábito
    const sel = el("select", "c-campo");
    sel.setAttribute("aria-label", `Elegir rutina para ${h.n}`);
    sel.append(el("option", null, "— elegir rutina —"));
    sel.firstChild.value = "";
    for (const x of S.rutinas.filter(x => !x.hab || x.hab === h.id)) sel.append(Object.assign(el("option", null, x.n), {value: x.id}));
    sel.onchange = () => { if (sel.value) { S.sesion[HOY] = {...(S.sesion[HOY] || {}), [h.id]: sel.value}; guardar(); } };
    const acc = el("div", "acc");
    acc.append(sel);
    f.append(el("div", "sub", "Sin rutina asignada"), acc);
    return f;
  }
  const viva = r.tipo === "pesas" && (S.gym[HOY] || []).find(s => s.rutina === r.id && !s.fin);
  const hecha = r.tipo === "pesas" && (S.gym[HOY] || []).find(s => s.rutina === r.id && s.fin);
  if (viva) cab.append(el("span", "c-chip ojo", "a medias"));
  f.append(el("div", "tit", r.n));
  const n = r.bloques.length;
  const dura = r.bloques.reduce((a, b) => a + b.seg, 0) + (r.pausa || 0) * Math.max(0, n - 1);
  f.append(el("div", "sub", r.tipo === "movilidad" ? `${n} pasos · ${Math.round(dura / 60)} min`
    : hecha ? resumen(hecha) : `${n} ejercicio${n === 1 ? "" : "s"}`));
  const acc = el("div", "acc");
  if (r.tipo === "pesas" || r.tipo === "movilidad") {
    const b = el("button", "c-btn" + (hecho(HOY, h.id) ? "" : " pri"), r.tipo === "movilidad" ? "Empezar" : viva ? "Seguir" : hecha ? "Otra vez" : "Empezar");
    b.onclick = () => (r.tipo === "movilidad" ? empiezaGuia(r) : empieza(r));
    acc.append(b);
  } else {
    // carrera y escalada: aquí solo se ve qué toca; se apuntan solas con el atajo o el bot
    const d = el("details"), ul = el("ul");
    d.append(el("summary", null, "Ver la sesión"));
    for (const b of r.bloques) { const li = el("li", null, b.ej); if (b.nota) li.append(el("small", null, b.nota)); ul.append(li); }
    d.append(ul);
    f.append(d);
  }
  if (h.id) {
    const ok = el("button", "c-btn", hecho(HOY, h.id) ? "Desmarcar" : "Hecho");
    ok.onclick = () => { tom.avisa(hecho(HOY, h.id) ? "desmarcar" : "marcar"); marca(h.id); guardar(); };
    acc.append(ok);
  }
  f.append(acc);
  return f;
}

function resumen(s) {
  const n = s.ej.reduce((a, e) => a + e.series.length, 0);
  const kg = s.ej.reduce((a, e) => a + e.series.reduce((b, [k, r]) => b + k * r, 0), 0);
  return [s.min && `${s.min} min`, `${n} series`, kg && `${Math.round(kg).toLocaleString("es")} kg movidos`].filter(Boolean).join(" · ");
}

function pintaHoy() {
  const d = fecha(HOY);
  $("#hoy-fecha").textContent = `${DIAS[d.getDay()]} ${d.getDate()} ${MESES[d.getMonth()]}`;
  const asignadas = S.sesion[HOY] || {};
  const ids = [...new Set([...Object.keys(asignadas), ...(S.plan[HOY] || [])])]
    .filter(id => habito(id) && (asignadas[id] || S.rutinas.some(r => r.hab === id)));   // solo lo que es entrenar
  const c = $("#hoy");
  c.replaceChildren(...ids.map(id => ficha(habito(id), rutina(asignadas[id]))));
  if (!ids.length) c.append(el("p", "vacio", "Hoy no toca entrenar. Si vas igual, elige abajo la rutina."));
  const atras = atrasados();
  if (atras.length) {
    const caja = el("div", "atras");
    caja.append(el("h3", null, "Se te pasó"));
    for (const [d, h] of atras) {
      const p = el("p"), txt = el("span", null, rutina((S.sesion[d] || {})[h])?.n || habito(h).n + " ");
      txt.append(el("small", null, ` · ${DIAS[fecha(d).getDay()]} ${fecha(d).getDate()}`));
      const b = el("button", "c-btn mini", "Hacer hoy");
      b.onclick = () => aHoy(d, h);
      p.append(txt, b);
      caja.append(p);
    }
    c.append(caja);
  }
  const o = $("#otra");
  o.replaceChildren(Object.assign(el("option", null, "Entrenar otra rutina…"), {value: ""}),
    ...S.rutinas.filter(r => r.tipo === "pesas").map(r => Object.assign(el("option", null, r.n), {value: r.id})));
}
// lo que tocaba en los últimos 6 días y no se hizo (lo más reciente de cada hábito), si hoy no toca ya lo mismo
function atrasados() {
  const entrena = new Set(S.rutinas.filter(r => r.tipo !== "movilidad" && r.hab).map(r => r.hab));
  const ultimo = new Map();
  for (let i = 6; i >= 1; i--) {
    const d = mas(HOY, -i);
    for (const h of new Set([...(S.plan[d] || []), ...Object.keys(S.sesion[d] || {})]))
      if (entrena.has(h) && habito(h) && !hecho(d, h)) ultimo.set(h, d);
    // hecho más tarde (otro día de la semana): ya no está pendiente
    for (const h of hechos(d)) if (ultimo.get(h) < d) ultimo.delete(h);
  }
  return [...ultimo].filter(([h]) => !hecho(HOY, h) && !(S.plan[HOY] || []).includes(h) && !(S.sesion[HOY] || {})[h])
    .map(([h, d]) => [d, h]);
}

// mover el día entero a hoy: el plan y la rutina. El plan de carrera se recalcula con el día nuevo
function aHoy(d, h) {
  S.plan[d] = (S.plan[d] || []).filter(x => x !== h);
  if (!S.plan[d].length) delete S.plan[d];
  S.plan[HOY] = [...new Set([...(S.plan[HOY] || []), h])];
  const r = (S.sesion[d] || {})[h];
  if (r) {
    delete S.sesion[d][h];
    if (!Object.keys(S.sesion[d]).length) delete S.sesion[d];
    S.sesion[HOY] = {...(S.sesion[HOY] || {}), [h]: r};
  }
  calma.vibra();
  guardar();
}

const foto = ej => window.monigote?.(ej.replace(/ · 2ª vuelta$/, "")) || null;

// ---------- modo entreno ----------
let A = null;   // {s: la sesión, r: la rutina, extra: {ej: filas de más}}
let reloj = null, desc = null;   // desc = {fin, total} del descanso en marcha

function empieza(r) {
  let s = (S.gym[HOY] || []).find(x => x.rutina === r.id && !x.fin);
  if (!s) {
    s = {id: uid(), rutina: r.id, n: r.n, t0: Date.now(), t1: 0, min: 0, fin: false, ej: []};
    (S.gym[HOY] ||= []).push(s);
    guardar();
  }
  abre(s);
}

function abre(s) {
  A = {s, r: rutina(s.rutina), extra: {}};
  despierta(true);
  recuerda({sesion: s.id});
  $("#hs-tit").textContent = s.n;
  pintaSesion();
  $("#hoja-sesion").toggleAttribute("data-on", true);
  clearInterval(reloj);
  reloj = setInterval(tic, 1000);
  tic();
}

const ejDe = (s, ej) => s.ej.find(e => e.ej === ej) || (s.ej.push({ej, series: []}), s.ej.at(-1));

// lo de hoy: la rutina sin lo quitado (gimnasio lleno) y, detrás, lo añadido. La rutina no cambia
// cómo se hizo un ejercicio en alguna rutina: series y repes de partida para uno añadido
const molde = ej => S.rutinas.flatMap(r => r.bloques).find(b => b.ej === ej) || {ej, series: 3, repes: ""};
function bloquesHoy() {
  const de = new Set(A.r.bloques.map(b => b.ej)), quita = new Set(A.s.quita || []);
  return [...A.r.bloques.filter(b => !quita.has(b.ej)),
          ...A.s.ej.filter(e => !de.has(e.ej)).map(e => ({...molde(e.ej), ej: e.ej, extra: true}))];
}
const ejercicios = () => [...new Set([...S.rutinas.flatMap(r => r.bloques.map(b => b.ej)), ...sesiones().flatMap(x => x.s.ej.map(e => e.ej))])]
  .sort((a, b) => a.localeCompare(b, "es"));

function quitaHoy(b) {
  if (b.extra) A.s.ej = A.s.ej.filter(e => e.ej !== b.ej);
  else A.s.quita = [...new Set([...(A.s.quita || []), b.ej])];
  guardar(false);
  pintaSesion();
}
function pieSesion() {
  const pie = el("div", "ej pie"), quitados = A.s.quita || [];
  if (quitados.length) {
    pie.append(el("p", "nota", "Quitados hoy (tócalo para volver a ponerlo):"));
    for (const ej of quitados) {
      const c = el("button", "c-chip", "↺ " + ej);
      c.onclick = () => { A.s.quita = quitados.filter(x => x !== ej); guardar(false); pintaSesion(); };
      pie.append(c);
    }
  }
  const f = el("form", "anade"), inp = Object.assign(el("input"), {placeholder: "Añadir un ejercicio hoy", required: true, enterKeyHint: "done"});
  inp.setAttribute("list", "ej-todos");
  inp.setAttribute("aria-label", "Ejercicio que añadir a la sesión de hoy");
  const dl = $("#ej-todos") || document.body.appendChild(Object.assign(el("datalist"), {id: "ej-todos"}));
  dl.replaceChildren(...ejercicios().map(n => Object.assign(el("option"), {value: n})));
  f.append(inp, el("button", "c-btn mini", "Añadir"));
  f.onsubmit = ev => {
    ev.preventDefault();
    const ej = inp.value.trim().replace(/\s+/g, " ");
    if (!ej || bloquesHoy().some(b => b.ej === ej)) return pintaSesion();
    if (A.r.bloques.some(b => b.ej === ej)) A.s.quita = (A.s.quita || []).filter(x => x !== ej);   // era de la rutina: vuelve
    else A.s.ej.push({ej, series: []});
    guardar(false);
    pintaSesion();
  };
  pie.append(f);
  return pie;
}

function pintaSesion() {
  const c = $("#hs-lista");
  const y = c.scrollTop;
  c.replaceChildren(...bloquesHoy().map(b => {
    const e = A.s.ej.find(e => e.ej === b.ej) || {ej: b.ej, series: []};
    const sg = sugerencia(b, A.s), r = rango(b.repes), seg = !!b.seg && !b.repes;
    const caja = el("div", "ej"), cab = el("div", "cab");
    cab.append(el("b", null, b.ej), el("span", null, `${b.series}×${b.repes || (seg ? b.seg + " s" : "–")}`));
    if (sg.sube) cab.append(el("span", "c-chip ok", `↑ sube a ${num(sg.kg)} kg`));
    if (!e.series.length) {   // con alguna serie hecha ya no se quita: se hizo
      const q = el("button", "c-btn mini quita", "Quitar");
      q.setAttribute("aria-label", `Quitar ${b.ej} de la sesión de hoy`);
      q.onclick = () => quitaHoy(b);
      cab.append(q);
    }
    const txt = el("div", "txt"), f = foto(b.ej);
    txt.append(cab);
    if (b.nota) txt.append(el("p", "nota", b.nota));
    if (f) { const fila = el("div", "fila-ej"); fila.append(txt, f); caja.append(fila); } else caja.append(txt);
    const filas = Math.max(b.series, e.series.length) + (A.extra[b.ej] || 0);
    for (let i = 0; i < filas; i++) caja.append(fila(b, e, i, sg, r, seg));
    const m = el("button", "c-btn mini mas", "+ serie");
    m.onclick = () => { A.extra[b.ej] = (A.extra[b.ej] || 0) + 1; pintaSesion(); };
    caja.append(m);
    if (sg.u) caja.append(el("p", "antes", "La última vez: " + sg.u.map(([k, n]) => (k ? `${num(k)}×${n}` : `${n}`)).join(" · ")));
    return caja;
  }), pieSesion());
  c.scrollTop = y;
  avisaApp();
}

function fila(b, e, i, sg, r, seg) {
  const hecha = e.series[i], f = el("div", "serie" + (hecha ? " hecha" : ""));
  const kg = Object.assign(el("input"), {type: "text", inputMode: "decimal", value: hecha ? num(hecha[0]) : sg.kg ? num(sg.kg) : "", placeholder: "0"});
  const n = Object.assign(el("input"), {type: "text", inputMode: "numeric", value: hecha ? hecha[1] : "",
    placeholder: String(sg.u?.[i]?.[1] ?? (seg ? b.seg : r ? r[0] : ""))});
  kg.setAttribute("aria-label", `Kilos, serie ${i + 1} de ${b.ej}`);
  n.setAttribute("aria-label", `${seg ? "Segundos" : "Repeticiones"}, serie ${i + 1} de ${b.ej}`);
  const ok = el("button", "ok");
  ok.innerHTML = CHECK;
  ok.setAttribute("aria-label", hecha ? `Deshacer serie ${i + 1}` : `Mantén pulsado: serie ${i + 1} hecha`);
  Object.assign(ok.dataset, {ej: b.ej, i});
  // en orden: la siguiente por hacer, o deshacer la última hecha
  ok.disabled = !(i === e.series.length || i === e.series.length - 1);
  const lee = () => [Math.min(500, Math.max(0, parseFloat(kg.value.replace(",", ".")) || 0)), Math.min(600, parseInt(n.value || n.placeholder) || 0)];
  // marcar se hace manteniendo (mantener); un toque de verdad no basta, para que no se marque sola con la mano
  // sudada. El clic desde código sí: es el de mantener y el de la isla dinámica (HoyEntreno.serieHecha), sin mantener
  ok.onclick = ev => {
    const ej = ejDe(A.s, b.ej);
    if (i === ej.series.length) {
      if (ev.isTrusted) return;
      const v = lee();
      if (!v[1]) return n.focus();
      const record = esRecord(b.ej, v);
      ej.series.push(v);
      A.s.t1 = Date.now();
      tom.avisa(record ? "record" : "serie");
      descansa(seg ? 60 : 90);
    } else ej.series.pop();
    guardar(false);
    pintaSesion();
  };
  // corregir una serie ya hecha
  if (hecha) kg.onchange = n.onchange = () => { ejDe(A.s, b.ej).series[i] = lee(); guardar(false); };
  if (!hecha) mantener(ok, () => ok.click());
  f.append(el("span", "i", i + 1), kg, el("span", null, "kg"), n, el("span", null, seg ? "s" : "rep"), ok);
  return f;
}

// mantener pulsado 0,8 s (dedo, ratón, o espacio / intro con el teclado); soltar antes cancela
function mantener(btn, hecho) {
  btn.insertAdjacentHTML("beforeend", '<svg class="anillo" viewBox="0 0 48 44" aria-hidden="true"><rect x="1.5" y="1.5" width="45" height="41" rx="9" pathLength="100"/></svg>');
  let t = 0;
  const empieza = e => {
    if (t || btn.disabled) return;
    e.preventDefault();
    btn.classList.add("lleno");
    t = setTimeout(() => { t = 0; btn.classList.remove("lleno"); hecho(); }, 800);
  };
  const suelta = () => { if (t) { clearTimeout(t); t = 0; btn.classList.remove("lleno"); } };
  btn.addEventListener("pointerdown", e => { if (e.button === 0) empieza(e); });
  for (const ev of ["pointerup", "pointerleave", "pointercancel"]) btn.addEventListener(ev, suelta);
  btn.addEventListener("keydown", e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); if (!e.repeat) empieza(e); } });
  btn.addEventListener("keyup", e => { if (e.key === " " || e.key === "Enter") suelta(); });
  btn.addEventListener("contextmenu", e => e.preventDefault());
}

function descansa(seg) {

  const st = estadoApp();

  $("#descanso").toggleAttribute("data-on", true);

  derrite();

// el número se derrite según pasa el descanso y, en los últimos 10 s, el fondo late cada vez más rápido
let derritiendo = 0;
function derrite() {
  cancelAnimationFrame(derritiendo);
  const caja = $("#descanso"), mapa = $("#d-map");
  const quieto = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
  const paso = () => {
    if (!desc || quieto()) {
      caja.removeAttribute("data-derrite");
      caja.style.removeProperty("--late");
      mapa.setAttribute("scale", "0");
      return;
    }
    const s = Math.max(0, (desc.fin - Date.now()) / 1000);
    mapa.setAttribute("scale", (Math.max(0, 1 - s / desc.total) * 22).toFixed(1));
    caja.style.setProperty("--late", s > 10 ? "0" : ((Math.sin(Date.now() / 1000 * Math.PI * 2 * (1 + (10 - s) * .35)) + 1) / 2 * .9).toFixed(3));
    derritiendo = requestAnimationFrame(paso);
  };
  caja.toggleAttribute("data-derrite", !quieto());
  paso();
}

function pintaProgreso() {
  const hist = {};   // ejercicio -> [{dia, mejor, series}]
  for (const {dia, s} of sesiones()) for (const e of s.ej) if (e.series.length) (hist[e.ej] ||= []).push({dia, m: mejor(e.series), series: e.series});
  const sel = $("#ej-sel"), antes = sel.value;

  t.append(cab);

  datos.append(t);

let g = null, ac = null;
// un pitido corto: estirando o entre series no estás mirando la pantalla
function pip(hz) {
  try {
    ac ||= new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), v = ac.createGain();
    o.frequency.value = hz;
    o.connect(v); v.connect(ac.destination);
    v.gain.setValueAtTime(.12, ac.currentTime);
    v.gain.exponentialRampToValueAtTime(.001, ac.currentTime + .18);
    o.start(); o.stop(ac.currentTime + .18);
  } catch (e) { /* sin audio se sigue igual */ }
}
// La pantalla encendida mientras dura la rutina o la sesión: con el iPhone bloqueado, iOS congela la web app
// y a veces la recarga entera desde la portada. Wake Lock existe en la app instalada desde iOS 18.4.
let wake = null;
async function despierta(on) {
  try {
    if (!on) { await wake?.release(); wake = null; return; }
    if (!wake && "wakeLock" in navigator) {
      wake = await navigator.wakeLock.request("screen");
      wake.addEventListener("release", () => (wake = null));
    }
  } catch (e) { /* sin permiso o sin soporte: se sigue igual */ }
}
// iOS suelta el bloqueo al salir de la app: al volver se pide otra vez
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && (g || A)) despierta(true); });

// Por si aun así se recarga: lo que está en marcha se guarda aquí, y calma.js vuelve a esta página desde la portada
const MARCHA = "entreno-en-marcha";
function recuerda(estado, minutos = 180) {
  try {
    if (estado) localStorage.setItem(MARCHA, JSON.stringify({...estado, dia: HOY, hasta: Date.now() + minutos * 60e3, url: "/entreno.html"}));
    else localStorage.removeItem(MARCHA);
  } catch (e) { /* sin almacenamiento, sin reanudar */ }
}

// con la hora de fin de cada paso, no contando tics: si la pantalla se apaga, al volver va por donde toca
function empiezaGuia(r, previo) {
  if (!r.bloques.length) return;
  clearInterval(g?.t);
  g = {r, i: 0, fin: Date.now() + (r.bloques[0].seg || 30) * 1000, pausa: false, queda: 0, ...previo, t: setInterval(ticGuia, 500)};
  $("#hg-tit").textContent = r.n;
  $("#hg-pausa").textContent = g.pausa ? "Seguir" : "Pausa";
  $("#hoja-guia").toggleAttribute("data-on", true);
  despierta(true);
  if (!previo) pip(660);
  guardaGuia();
  ticGuia();
}
// caduca a los 20 min del último paso: una rutina abandonada a medias no se da por hecha horas después
const guardaGuia = () => recuerda({guia: g.r.id, i: g.i, fin: g.fin, pausa: g.pausa, queda: g.queda, cambio: g.cambio}, 20);
function ticGuia() {
  if (!g) return;
  if (!g.pausa) {
    let saltados = 0;
    while (g && Date.now() >= g.fin) { pasoGuia(1, g.fin); saltados++; }
    if (!g) return;
    if (saltados) pip(880);
    g.queda = Math.max(1, Math.ceil((g.fin - Date.now()) / 1000));
    if (g.queda <= 3 && g.queda !== g.pitado) { g.pitado = g.queda; pip(520); }
  }
  pintaGuia();
}
function pasoGuia(n, desde = Date.now()) {
  // entre paso y paso, la pausa de la rutina (r.pausa s) para colocarse: «Prepárate» con el siguiente a la vista.
  // Saltar durante la pausa empieza ya el siguiente
  if (n > 0 && !g.cambio && g.r.pausa && g.i + 1 < g.r.bloques.length) {
    g.cambio = true;
    g.fin = desde + g.r.pausa * 1000;
    g.queda = g.r.pausa;
    guardaGuia();
    return pintaGuia();
  }
  g.cambio = false;
  g.i += n;
  if (g.i >= g.r.bloques.length) return acabaGuia();
  g.fin = desde + (g.r.bloques[g.i].seg || 30) * 1000;
  g.queda = g.r.bloques[g.i].seg || 30;
  guardaGuia();
  pintaGuia();
}
function pintaGuia() {
  const i = g.i + (g.cambio ? 1 : 0), b = g.r.bloques[i], total = g.cambio ? g.r.pausa : b.seg || 30;
  $("#hg-paso").textContent = `${g.cambio ? "Prepárate · " : ""}Paso ${i + 1} de ${g.r.bloques.length}`;

    if (!d || !/^\d{8}-\d{6}$/.test(d.intento || "")) return;
    const antes = vivos[d.intento];
    vivos[d.intento] = {...antes, ...d};
    if (antes && antes.fase === d.fase && (d.fase === "comprimiendo" || d.fase === "subiendo")) {
      const b = document.querySelector(`#curso-${d.intento} .c-barra i`), t = document.querySelector(`#curso-${d.intento} .c-chip`);
      if (b) b.style.width = `${Math.round((d.progreso || 0) * 100)}%`;
      if (t) t.textContent = estadoTexto(vivos[d.intento]);
      return;
    }
    if (d.fase === "previa" || d.fase === "listo") { delete previas[d.intento]; cargar(); }
    else if (E) pinta();
  }
  addEventListener("tom-escalada", e => recibe(e.detail));

  const estadoTexto = v => (FASE[v.fase] || v.fase) + (v.progreso != null && (v.fase === "comprimiendo" || v.fase === "subiendo")
                                                       ? ` ${Math.round(v.progreso * 100)} %` : "");

  // los de camino: los que conoce el servidor (E.pendientes) y los que aún no le han llegado (vivos)
  function enCurso() {
    const lista = new Map(E.pendientes.map(x => [x.intento, {...x}]));
    for (const [i, v] of Object.entries(vivos)) {
      if (E.intentos.some(x => x.intento === i)) continue;
      const x = lista.get(i) || {intento: i, color: v.color || "", nombre: v.nombre || "", quien: "", estado: "subiendo", previa: false};
      // si el análisis ha fallado, eso es lo que cuenta, no que la subida acabó bien
      if (!(x.estado === "error" && (v.fase === "listo" || v.fase === "previa"))) x.vivo = v;
      lista.set(i, x);
    }
    return [...lista.values()].sort((a, b) => b.intento.localeCompare(a.intento)).map(x => {
      const it = el("div", "esc-curso"), cab = el("div", "esc-t"), punto = el("span", "esc-punto"), izq = el("span", "esc-bloque");
      it.id = `curso-${x.intento}`;
      izq.style.margin = "0";
      punto.style.background = COLOR[x.color] || "var(--tenue)";
      izq.append(punto, el("span", null, `${x.nombre || (x.color ? `Bloque ${x.color}` : "Intento")} · ${cuando(x.intento)}`));
      const v = x.vivo, fallo = (v && v.fase === "error") || x.estado === "error";
      const texto = v && v.fase !== "listo" ? estadoTexto(v) : x.estado === "error" ? "no se ha podido" : x.estado === "subiendo" ? "subiendo" : "analizando…";
      cab.append(izq, el("span", `c-chip ${fallo ? "mal" : ""}`, texto));
      it.append(cab);
      if (v && (v.fase === "comprimiendo" || v.fase === "subiendo")) {
        const b = el("div", "c-barra"), i = el("i");
        i.style.width = `${Math.round((v.progreso || 0) * 100)}%`;
        b.append(i);
        it.append(b);
      }
      const motivo = (v && v.fase === "error" && v.texto) || x.error;
      if (fallo && motivo) it.append(el("p", "esc-pista", motivo + (window.HoyApp && v ? " · Reinténtalo desde «Subir intento»." : "")));
      if (x.previa) it.append(vistaPrevia(x.intento));
      return it;
    });
  }

  // ---------- la vista previa: el esqueleto de Vision animado y la estela del centro de gravedad ----------
  // 19 puntos en el orden de Escalada.swift: nariz, ojos, orejas, hombros, cuello, codos, muñecas, raíz, caderas, rodillas, tobillos
  const HUESOS = [[5, 6], [5, 8], [8, 10], [6, 9], [9, 11], [5, 13], [6, 14], [13, 14], [13, 15], [15, 17], [14, 16], [16, 18], [0, 7]];
  function vistaPrevia(intento) {
    const caja = el("div", "esc-previa"), lienzo = el("canvas");
    lienzo.setAttribute("role", "img");
    lienzo.setAttribute("aria-label", "Esqueleto y centro de gravedad del intento, sacados en el iPhone");
    caja.append(lienzo, el("small", null, "Vista previa del iPhone · el análisis completo llega en unos minutos"));
    if (!previas[intento]) previas[intento] = fetch(`/api/escalada/${intento}/previa`).then(r => r.ok ? r.json() : null).catch(() => null);
    previas[intento].then(p => p && p.fotogramas && p.fotogramas.length && anima(lienzo, p));
    return caja;
  }

  function anima(lienzo, p) {
    const ancho = Math.min(lienzo.parentElement.clientWidth || 320, 480), alto = Math.round(ancho * p.alto / p.ancho);
    const r = devicePixelRatio || 1, ctx = lienzo.getContext("2d"), fs = p.fotogramas;
    const estilo = getComputedStyle(document.documentElement), acento = estilo.getPropertyValue("--acento").trim() || "#5E7A1E";
    lienzo.width = ancho * r;
    lienzo.height = alto * r;
    lienzo.style.maxWidth = `min(100%, ${ancho}px)`;   // alto y ancho automáticos: el max-height del CSS no lo deforma
    ctx.scale(r, r);
    let fondo = null;
    if (p.primero) { fondo = new Image(); fondo.src = p.primero; }
    const dura = Math.max(fs[fs.length - 1][0], 0.5), quieto = matchMedia("(prefers-reduced-motion: reduce)").matches, t0 = performance.now();
    const dibuja = n => {
      ctx.clearRect(0, 0, ancho, alto);
      if (fondo && fondo.complete && fondo.naturalWidth) {
        ctx.globalAlpha = .55;
        ctx.drawImage(fondo, 0, 0, ancho, alto);
        ctx.globalAlpha = 1;
      }
      // la estela: los últimos 3 s del centro de gravedad
      ctx.lineWidth = 3;
      ctx.lineCap = ctx.lineJoin = "round";
      let antes = null;
      for (let k = 0; k <= n; k++) {
        const [t, cx, cy] = fs[k];
        if (cx == null || fs[n][0] - t > 3) { antes = null; continue; }
        if (antes) {
          ctx.strokeStyle = "rgba(240,138,44," + (0.25 + 0.75 * (1 - (fs[n][0] - t) / 3)).toFixed(2) + ")";
          ctx.beginPath(); ctx.moveTo(antes[0] * ancho, antes[1] * alto); ctx.lineTo(cx * ancho, cy * alto); ctx.stroke();
        }
        antes = [cx, cy];
      }
      const pts = fs[n][3];
      ctx.strokeStyle = acento;
      ctx.lineWidth = 3;
      for (const [a, b] of HUESOS) {
        if (pts[a][2] < .3 || pts[b][2] < .3) continue;
        ctx.beginPath(); ctx.moveTo(pts[a][0] * ancho, pts[a][1] * alto); ctx.lineTo(pts[b][0] * ancho, pts[b][1] * alto); ctx.stroke();
      }
      ctx.fillStyle = acento;
      for (const [x, y, c] of pts) if (c >= .3) { ctx.beginPath(); ctx.arc(x * ancho, y * alto, 3, 0, 7); ctx.fill(); }
      if (fs[n][1] != null) {
        ctx.fillStyle = "#F08A2C";
        ctx.beginPath(); ctx.arc(fs[n][1] * ancho, fs[n][2] * alto, 6, 0, 7); ctx.fill();
      }
    };
    const busca = t => { let n = 0; while (n + 1 < fs.length && fs[n + 1][0] <= t) n++; return n; };
    if (quieto) {
      const n = fs.reduce((m, f, k) => (f[1] != null ? k : m), 0);
      if (fondo) fondo.onload = () => dibuja(n);
      return dibuja(n);
    }
    const paso = ahora => {
      if (!lienzo.isConnected) return;   // repintado: el lienzo nuevo lleva su propia animación
      if (!document.hidden) dibuja(busca(((ahora - t0) / 1000) % (dura + 1)));
      requestAnimationFrame(paso);
    };
    requestAnimationFrame(paso);
  }

  addEventListener("visibilitychange", () => document.visibilityState === "visible" && cargar());
  $("#f-clave").addEventListener("submit", () => setTimeout(cargar, 1500));   // tras entrar con la contraseña
  cargar();
})();
</script>
</body>
</html>
